name: VK movie recommendation auto-publisher

on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "30 6 * * *"
    - cron: "0 8 * * *"
    - cron: "30 9 * * *"
    - cron: "0 11 * * *"
    - cron: "30 12 * * *"
    - cron: "0 14 * * *"
    - cron: "30 15 * * *"
    - cron: "0 17 * * *"
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Unique manual slot label (optional)"
        required: false
        default: "manual"

concurrency:
  group: daily-vk-movies
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Publish recommendation
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          POST_SLOT: ${{ github.event_name == 'schedule' && github.event.schedule || inputs.slot || 'manual' }}
        run: python main.py
      - name: Save publication history
        run: |
          if [[ -n "$(git status --porcelain post_history.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add post_history.json
            git commit -m "Update publication history"
            git push
          fi
